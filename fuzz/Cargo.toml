# Coverage-guided fuzzing of Septuvo's parsers with cargo-fuzz / libFuzzer
# (H-018, decision D-035). Development only: never built into Septuvo and never
# shipped. A separate workspace, so the main workspace keeps no third-party
# crates (its Cargo.lock is checked in CI). Run from this directory:
#   cargo +nightly fuzz run toml_subset
# See docs/build/fuzzing.md.

[package]
name = "septuvo-fuzz"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "Coverage-guided fuzz targets for Septuvo's parsers (development only)"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Reviewed in docs/reviews/dependency-review-cargo-fuzz.md. Exact pin.
libfuzzer-sys = "=0.4.13"
septuvo-policy = { path = "../crates/septuvo-policy" }
septuvo-config = { path = "../crates/septuvo-config" }
septuvo-ipc = { path = "../crates/septuvo-ipc" }
septuvo-server = { path = "../crates/septuvo-server" }
septuvo-daemon = { path = "../crates/septuvo-daemon" }

# Its own workspace: not a member of the main one.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "policy_file"
path = "fuzz_targets/policy_file.rs"
test = false
doc = false
bench = false

