name: Rust

# Tracks N1 and N2 (non-crypto foundation): format, lint and test the Rust workspace.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: No third-party crates (N1 and N2 work orders)
        run: |
          if grep -q '^source = ' Cargo.lock; then
            echo "Cargo.lock contains a third-party crate; N1 allows the standard library only." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      # Compiler and lint messages are also emitted as GitHub annotations, so
      # failures are visible on the pull request without opening the raw log.
      - name: Lint (warnings are errors)
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          sed -n 's/^\([^: ]*\):\([0-9]*\):\([0-9]*\): \(error\|warning\)[^:]*: \(.*\)$/::error file=\1,line=\2,col=\3::\5/p' clippy.txt
          exit "$status"

      - name: Test
        run: |
          set +e
          cargo test --workspace --locked --message-format=short 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          sed -n 's/^\([^: ]*\):\([0-9]*\):\([0-9]*\): \(error\|warning\)[^:]*: \(.*\)$/::error file=\1,line=\2,col=\3::\5/p' test.txt
          exit "$status"

  # N1-03: kill-switch, DNS and IPv6 leak tests in throw-away network
  # namespaces on the disposable runner. No tunnel, no traffic leaves the
  # runner, nothing outside the namespaces is changed.
  lab:
    name: lab (kill switch in network namespaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Install lab tools (Ubuntu packages, runner only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nftables iproute2
          nft --version
          ip -V

      - name: Build the ruleset generator
        run: cargo build -p septuvo-policy --example render_nft --locked

      - name: Run the namespace lab (IPv6 required)
        run: sudo tests/lab/namespaces/run.sh --require-ipv6 target/debug/examples/render_nft

      # N2-02: the privileged service and the unprivileged CLI, with two
      # throw-away users, in throw-away namespaces on this runner only.
      - name: Build the service and the CLI
        run: cargo build -p septuvo-daemon -p septuvo-cli --bins --locked

      - name: Run the service lab
        run: sudo tests/lab/namespaces/daemon.sh target/debug/septuvod target/debug/septuvo

      # N2-03: DNS lockdown and the resolver file (IPv6 required).
      - name: Run the DNS lab (IPv6 required)
        run: sudo tests/lab/namespaces/dns.sh --require-ipv6 target/debug/septuvod target/debug/septuvo

      # N3-02: captive-portal mode, with one real 1-minute window (IPv6 required).
      - name: Run the captive-portal lab (IPv6 required)
        run: sudo tests/lab/namespaces/captive.sh --require-ipv6 target/debug/septuvod target/debug/septuvo

  # N3-01: installer and systemd service. A staged install (no root), then a
  # real install, use and uninstall on this disposable runner only.
  install:
    name: install (real install on a disposable runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Install lab tools (Ubuntu packages, runner only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nftables iproute2
          systemctl --version | head -1

      - name: Build release binaries (not published)
        run: cargo build --release --locked --bins

      - name: Staged install (no root)
        run: tests/lab/install/run.sh target/release

      - name: Real install, use and uninstall (disposable runner)
        run: sudo tests/lab/install/run.sh --real target/release
