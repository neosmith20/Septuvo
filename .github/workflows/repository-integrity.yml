name: Repository Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Two checkouts (H-008): the files under review come from the pull
      # request, but the check scripts always come from the trusted base
      # branch, so a pull request cannot edit the checks that judge it.
      - name: Checkout files under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          path: review
          persist-credentials: false
      - name: Checkout trusted check scripts (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          ref: ${{ github.base_ref || github.sha }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false
      - name: Unit tests for the ledger scripts in this pull request
        run: python3 -m unittest discover -s review/scripts/tests -p "test_*.py" -v
      - name: Select check scripts
        run: |
          if grep -q SEPTUVO_ROOT trusted/scripts/check_repository.py trusted/scripts/verify_ledger.py; then
            echo "CHECKS=trusted/scripts" >> "$GITHUB_ENV"
          else
            # Only possible until H-008 itself is on the base branch.
            echo "::warning::Base-branch scripts predate H-008; using this pull request's scripts for this run only."
            echo "CHECKS=review/scripts" >> "$GITHUB_ENV"
          fi
      - name: Validate planning documents and repository links
        env:
          SEPTUVO_ROOT: ${{ github.workspace }}/review
        run: python3 "$CHECKS/check_repository.py"
      - name: Verify ledger records against GitHub (D-031)
        env:
          SEPTUVO_ROOT: ${{ github.workspace }}/review
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$CHECKS/verify_ledger.py"
      - name: Licensing boundaries (D-033)
        env:
          SEPTUVO_ROOT: ${{ github.workspace }}/review
        run: |
          if [ -f "$CHECKS/check_licensing.py" ]; then
            python3 "$CHECKS/check_licensing.py"
          else
            # Only until D-033 itself is on the base branch.
            echo "::warning::Base branch has no licensing check yet; using this pull request's copy for this run only."
            python3 review/scripts/check_licensing.py
          fi
      # Never blocks: reports where STATUS.md lags behind owner-merged pull
      # requests, so an agent can open a sync pull request (D-031).
      - name: Ledger drift report (non-blocking)
        if: always()
        continue-on-error: true
        env:
          SEPTUVO_ROOT: ${{ github.workspace }}/review
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$CHECKS/sync_status.py" ]; then python3 "$CHECKS/sync_status.py"; fi
