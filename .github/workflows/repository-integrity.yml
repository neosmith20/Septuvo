name: Repository Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository (pinned release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-13
        with:
          persist-credentials: false
      - name: Validate planning documents and repository links
        run: python3 scripts/check_repository.py
      - name: Verify owner decisions mirrored in docs/STATUS.md (D-025)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_ledger.py
