# Septuvo Rust workspace (tracks N1 and N2: non-crypto foundation, D-029/D-030).
# No third-party crates: every dependency must be approved in a work order first.
# Licensing (D-033): no workspace-wide license. Each crate declares its own,
# and licensing.toml must classify it (checked by scripts/check_licensing.py).

[workspace]
resolver = "3"
# fuzz/ (cargo-fuzz, development only; D-035) and desktop/ (the Septuvo VPN
# desktop app with its reviewed third-party crates; N4) are separate workspaces.
exclude = ["fuzz", "desktop"]
members = ["crates/septuvo-policy", "crates/septuvo-cli", "crates/septuvo-config", "crates/septuvo-ipc", "crates/septuvo-daemon", "crates/septuvo-server", "crates/septuvo-native-gate"]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/neosmith20/Septuvo"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
